name: Pingo AI
description: 'Pingo AI, Inc. is a consumer language-learning application that uses
  conversational AI to help learners practice speaking across 15 languages including
  English, Spanish, French, German, Japanese, Korean, Chinese, Italian, Portuguese,
  and Arabic. Learners hold real-time voice conversations with an adaptive AI tutor
  and get a transcript and vocabulary list for every session, following personalized
  learning paths. Pingo is distributed as iOS and Android mobile apps and publishes
  no public API, SDK, or developer platform. Backed by Matrix Partners.'
